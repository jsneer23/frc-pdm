[tools]
biome = "2.5.9"
deno = "2.9.8"
node = "24"
pnpm = "12.11.2"
supabase = "2.121.0"

[tasks."gen:types"]
description = "Generate TypeScript types from the linked Supabase database"
run = [
  "supabase gen types typescript --linked --schema public > apps/ui/src/lib/database.types.ts",
  "cp apps/ui/src/lib/database.types.ts supabase/functions/_shared/database.types.ts",
]

[tasks."db:new"]
description = "Create a new empty migration in supabase/migrations"
usage = 'arg "<name>" help="A short snake_case description, for example add_is_admin_to_members"'
run = 'supabase migration new "${usage_name}"'

[tasks."db:push"]
description = "Apply migrations, then regenerate types"
run = [
  "supabase db push",
  "mise run gen:types",
]

[tasks."pnpm:check_version"]
description = "Get recent pnpm versions for use in pnpm:update"
run = "mise ls-remote pnpm | grep -E '^[0-9]+\\.[0-9]+\\.[0-9]+$' | tail -5"

[tasks."pnpm:update"]
description = "Change the pnpm version in mise.toml and package.json, then verify"
usage = 'arg "<version>" help="The pnpm version, for example 11.2.0"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

v="${usage_version}"

mise use "pnpm@$v"

cd apps/ui
npm pkg set packageManager="pnpm@$v"

mise exec "pnpm@$v" -- pnpm install
mise exec "pnpm@$v" -- pnpm typecheck
mise exec "pnpm@$v" -- pnpm build

echo "pnpm is now $v. Commit mise.toml, apps/ui/package.json, and the lockfile together."
'''

[tasks."node:update"]
description = "Change the Node version in mise.toml, then verify"
usage = 'arg "<version>" help="The Node major version, for example 24"'
run = [
  "mise use node@{{usage.version}}",
  "node --version",
]

[tasks."functions:serve"]
description = "Serve all Edge Functions locally (needs `supabase start`)"
run = "supabase functions serve"

[tasks."functions:check"]
description = "Type-check every Edge Function"
depends = ["functions:lint", "functions:fmt"]
run = [
	"cd supabase/functions/onshape && deno check index.ts",
	"cd supabase/functions/onshape-webhook && deno check index.ts",
]

[tasks."functions:deploy"]
description = "Type-check, then deploy both Edge Functions"
depends = ["functions:check"]
run = [
	"supabase functions deploy onshape",
	"supabase functions deploy onshape-webhook",
]

[tasks."functions:secrets"]
description = "Push secrets to the remote project (refuses if the dev flag is in the file)"
run = """
if grep -qi '^ONSHAPE_DEV=' supabase/functions/.env; then
  echo 'The dev flag is in supabase/functions/.env; move it to onshape/.env.' >&2
  exit 1
fi
supabase secrets set --env-file supabase/functions/.env
supabase secrets list
"""

[tasks."functions:lint"]
description = "Biome braces rule for Edge Functions (deno lint does the rest)"
dir = "{{config_root}}/supabase/functions"
run = [
  "deno lint --ignore=_shared/database.types.ts",
  "biome lint .",
]

[tasks."functions:fmt"]
description = "Fail if Edge Function files aren't biome formatted"
dir = "{{config_root}}/supabase/functions"
run = "biome format ."

[tasks."db:start"]
description = "Start the local Supabase stack (needs Docker)"
run = "supabase start"

[tasks."db:stop"]
description = "Stop the local Supabase stack, keeping its data"
run = "supabase stop"

[tasks."db:reset"]
description = "Rebuild local db from migrations and seed.sql"
run = "supabase start"

[tasks."mail"]
description = "Open the local Supabase inbox for sign-in codes (macOS only)"
run = "open http://127.0.0.1:54324"

[tasks."hooks"]
description = "Test pre-commit and pre-push hooks before actually doing either"
run = [
  "lefthook run pre-commit",
  "lefthook run pre-push"
]